<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
            margin: 0;
            padding: 0;
        }

        nav {
            background: #111827;
            padding: 12px 20px;
        }

        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        nav a,
        nav button {
            color: #ffffff;
            text-decoration: none;
            font: inherit;
            background: #2563eb;
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            cursor: pointer;
        }

        h1 {
            max-width: 720px;
            margin: 48px auto 0;
            background: #ffffff;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
            text-align: center;
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li>
                <form action="/logout" method="get">
                    <button type="submit">Logout</button>
                </form>
            </li>
        </ul>
    </nav>
    <h1>You are logged in as {{ username }}!</h1>
</body>
</html>
