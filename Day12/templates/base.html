<!DOCTYPE html>
<html>
<head>
    <title>Flask ORM Demo</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
    <h1>Flask SQLAlchemy Demo</h1>

    <nav>
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('add_student') }}">Add Student</a>
        <a href="{{ url_for('students') }}">View Students</a>
    </nav>
</header>

<div class="container">

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <ul class="flashes">
                    {% for category, msg in messages %}
                        <li class="flash {{ category }}">{{ msg }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}

        {% block content %}
        {% endblock %}

</div>

</body>
</html>
